name: Create Board

on:
  push:
  workflow_dispatch:

jobs:
  create-board:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug workspace
        run: |
          echo "=== Workspace contents ==="
          ls -la
          echo "=== hellen-one ==="
          ls -la hellen-one/ 2>/dev/null || echo "NOT FOUND"
          echo "=== kicad-libraries ==="
          ls -la kicad-libraries/ 2>/dev/null || echo "NOT FOUND"
          echo "=== hellen-one/kicad ==="
          ls -la hellen-one/kicad/ 2>/dev/null || echo "NOT FOUND"

      - name: Install KiCad 8
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad

      - name: Set variables
        id: vars
        run: |
          . revision.txt
          echo "BOARD_PREFIX=$BOARD_PREFIX" >> $GITHUB_ENV
          echo "BOARD_SUFFIX=$BOARD_SUFFIX" >> $GITHUB_ENV
          echo "IN=${BOARD_PREFIX}${BOARD_SUFFIX}" >> $GITHUB_ENV

      - name: Generate Gerber Files
        run: |
          IN=$IN
          OUT_FOLDER=gerber
          mkdir -p $OUT_FOLDER

          # Export PDF from schematic
          kicad-cli sch export pdf "$IN.kicad_sch" --no-background-color -o "$OUT_FOLDER/$IN.pdf"

          # Export netlist and BOM
          kicad-cli sch export netlist "$IN.kicad_sch" --format kicadxml -o "$OUT_FOLDER/$IN.net"

          # Export Gerbers (no zone refill for KiCad 8)
          kicad-cli pcb export gerbers --disable-aperture-macros -l "F.Cu,B.Cu,F.Paste,B.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts" --no-x2 "$IN.kicad_pcb" -o $OUT_FOLDER/

          # Export drill file
          kicad-cli pcb export drill --map-format ps --excellon-zeros-format suppressleading -u "in" "$IN.kicad_pcb" -o $OUT_FOLDER/

          # Export positions file
          kicad-cli pcb export pos --format csv --units mm --bottom-negate-x "$IN.kicad_pcb" -o "$OUT_FOLDER/$IN-all-pos.csv"

          # Copy BOM
          cp bom/bom.csv "$OUT_FOLDER/$IN-bom.csv" 2>/dev/null || true

          ls -la $OUT_FOLDER/

      - name: Create boards directory structure
        run: |
          IN=$IN
          BOARD_DIR="boards/$IN"
          BOARD_BOARD_DIR="$BOARD_DIR/board"
          BOARD_FRAME_DIR="$BOARD_DIR/frame"
          BOARD_GERBER_DIR="$BOARD_BOARD_DIR/gerber"
          BOARD_MISC_DIR="$BOARD_BOARD_DIR/misc"

          mkdir -p "$BOARD_BOARD_DIR"
          mkdir -p "$BOARD_FRAME_DIR"
          mkdir -p "$BOARD_GERBER_DIR"
          mkdir -p "$BOARD_MISC_DIR"

          # Clean up old files in board directory
          rm -rf "$BOARD_BOARD_DIR"/*
          rm -rf "$BOARD_FRAME_DIR"/*
          rm -rf "$BOARD_MISC_DIR"/*

          # Copy gerber files to board/gerber
          cp gerber/* "$BOARD_GERBER_DIR/"

          # Explicitly copy gerber files to frame with simplified naming
          # Using explicit file copies instead of dynamic renaming for reliability
          cp gerber/${IN}-F_Cu.gtl "$BOARD_FRAME_DIR/knock-processor-F_Cu.gtl" 2>/dev/null || true
          cp gerber/${IN}-B_Cu.gbl "$BOARD_FRAME_DIR/knock-processor-B_Cu.gbl" 2>/dev/null || true
          cp gerber/${IN}-F_Paste.gtp "$BOARD_FRAME_DIR/knock-processor-F_Paste.gtp" 2>/dev/null || true
          cp gerber/${IN}-B_Paste.gbp "$BOARD_FRAME_DIR/knock-processor-B_Paste.gbp" 2>/dev/null || true
          cp gerber/${IN}-F_SilkS.gto "$BOARD_FRAME_DIR/knock-processor-F_SilkS.gto" 2>/dev/null || true
          cp gerber/${IN}-B_SilkS.gbo "$BOARD_FRAME_DIR/knock-processor-B_SilkS.gbo" 2>/dev/null || true
          cp gerber/${IN}-F_Mask.gts "$BOARD_FRAME_DIR/knock-processor-F_Mask.gts" 2>/dev/null || true
          cp gerber/${IN}-B_Mask.gbs "$BOARD_FRAME_DIR/knock-processor-B_Mask.gbs" 2>/dev/null || true
          cp gerber/${IN}-Edge_Cuts.gm1 "$BOARD_FRAME_DIR/knock-processor-Edge_Cuts.gm1" 2>/dev/null || true
          cp gerber/${IN}.drl "$BOARD_FRAME_DIR/knock-processor.drl" 2>/dev/null || true
          cp gerber/${IN}.net "$BOARD_FRAME_DIR/knock-processor.net" 2>/dev/null || true
          cp gerber/${IN}.pdf "$BOARD_FRAME_DIR/knock-processor.pdf" 2>/dev/null || true
          cp gerber/${IN}-all-pos.csv "$BOARD_FRAME_DIR/knock-processor-all-pos.csv" 2>/dev/null || true
          cp gerber/${IN}-bom.csv "$BOARD_FRAME_DIR/knock-processor-bom.csv" 2>/dev/null || true
          cp gerber/${IN}-job.gbrjob "$BOARD_FRAME_DIR/knock-processor-job.gbrjob" 2>/dev/null || true

          # Copy BOM to board/misc
          cp gerber/${IN}-bom.csv "$BOARD_MISC_DIR/${IN}-BOM.csv" 2>/dev/null || true

          # Copy CPL to board
          cp gerber/${IN}-all-pos.csv "$BOARD_BOARD_DIR/${IN}-CPL.csv" 2>/dev/null || true

          # Create board.cfg
          echo "[${IN}]" > "$BOARD_DIR/board.cfg"
          echo "Prefix = boards/${IN}/board/${IN}" >> "$BOARD_DIR/board.cfg"
          echo "*TopCopper=%(prefix)s.GTL" >> "$BOARD_DIR/board.cfg"
          echo "*TopSoldermask=%(prefix)s.GTS" >> "$BOARD_DIR/board.cfg"
          echo "*TopSolderPasteMask=%(prefix)s.GTP" >> "$BOARD_DIR/board.cfg"
          echo "*TopSilkscreen=%(prefix)s.GTO" >> "$BOARD_DIR/board.cfg"
          echo "*BottomCopper=%(prefix)s.GBL" >> "$BOARD_DIR/board.cfg"
          echo "*BottomSoldermask=%(prefix)s.GBS" >> "$BOARD_DIR/board.cfg"
          echo "*BottomSilkscreen=%(prefix)s.GBO" >> "$BOARD_DIR/board.cfg"
          echo "*Keepout=%(prefix)s.GKO" >> "$BOARD_DIR/board.cfg"
          echo "Drills=%(prefix)s.DRL" >> "$BOARD_DIR/board.cfg"
          echo "drillspth=%(prefix)s.DRL" >> "$BOARD_DIR/board.cfg"
          echo "BoardOutline=%(prefix)s.GM15" >> "$BOARD_DIR/board.cfg"

          # Create board_place.txt
          echo "${IN},0,0,Top,0" > "$BOARD_BOARD_DIR/board_place.txt"

          # Copy schematic PDF
          cp gerber/${IN}.pdf "$BOARD_MISC_DIR/${IN}-schematic.pdf" 2>/dev/null || true

          # Generate ibom.html (InteractiveHtmlBom)
          python3 hellen-one/bin/InteractiveHtmlBom/InteractiveHtmlBom/generate_interactive_bom.py \
            --no-browser --dest-dir "$BOARD_MISC_DIR" \
            --name-format "${IN}-ibom" \
            "${IN}.kicad_pcb" 2>/dev/null || true

          # Generate board images
          kicad-cli pcb render --side top --output "$BOARD_MISC_DIR/${IN}-top.png" "${IN}.kicad_pcb" 2>/dev/null || true
          kicad-cli pcb render --side bottom --output "$BOARD_MISC_DIR/${IN}-bottom.png" "${IN}.kicad_pcb" 2>/dev/null || true
          kicad-cli pcb render --side outline --output "$BOARD_MISC_DIR/${IN}-outline.png" "${IN}.kicad_pcb" 2>/dev/null || true
          kicad-cli pcb render --side top --components --output "$BOARD_MISC_DIR/${IN}-components.png" "${IN}.kicad_pcb" 2>/dev/null || true

          # Create ZIP of gerber files
          cd "$BOARD_BOARD_DIR"
          zip -r "../${IN}-gerber.zip" gerber/ 2>/dev/null || true
          cd - > /dev/null

          ls -la "$BOARD_DIR"
          echo "=== Frame directory ==="
          ls -la "$BOARD_FRAME_DIR"

      - name: Commit and Push All Files
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --ff-only
          git add gerber/ boards/
          git diff --cached --quiet || git commit -m "ci: generate fabrication files [skip ci]"
          git push